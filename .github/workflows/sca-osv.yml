name: SCA - OSV Scanner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |
        --recursive
        ./
      results-file-name: osv-results-frontend.sarif
      upload-sarif: false
      fail-on-vuln: false
